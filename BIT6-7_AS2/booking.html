<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book an appointment</title>
    <meta
      name="description"
      content="ook your dog's grooming appointment with Snazzy Paws Grooming."
    />
    <link rel="stylesheet" href="css/my-css.css" />
  </head>
  <body>
    <!--header-->
    <header>
      <nav class="nav" aria-label="top navigation">
        <div class="container">
          <!--company name-->
          <a href="index.html" class="logo">Snazzy Paws Grooming</a>
          <!--navigation menu-->
          <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li>
              <a href="booking.html" class="active" aria-current="page">Book</a>
            </li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>
    <!--main content-->
    <main>
      <section class="top-section">
        <div class="container">
          <h1>Book an appointment</h1>
          <form class="booking-form" action="">
            <!-- owner details -->
            <fieldset>
              <legend>Owner details</legend>

              <div>
                <label for="owner-name">Owner's name:</label>
                <input type="text" id="owner-name" name="owner-name" required />
              </div>

              <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required />
              </div>
            </fieldset>

            <!-- dog details-->
            <fieldset>
              <legend>Your dog's information</legend>
              <div>
                <label for="dog-name">Your dog's name</label>
                <input type="text" id="dog-name" name="dog-name" required />
              </div>
              <div>
                <label for="dog-breed">Dog breed</label>
                <input type="text" id="dog-breed" name="dog-breed" />
              </div>
              <div>
                <label for="dog-age">Dog's age</label>
                <input type="number" id="dog-age" name="dog-age" min="0" />
              </div>
            </fieldset>
            <!-- services -->
            <fieldset class="services">
              <legend>Choose services</legend>

              <input
                type="checkbox"
                id="bath-and-brush"
                name="services"
                value="bath-and-brush"
              />
              <label class="card" for="bath-and-brush">
                <strong>Bath and Brush</strong>
                <span>shampoo, blow-dry, brush-out and nail trim </span>
              </label>

              <input type="checkbox" name="services" value="haircut" />
              <label for="haircut">
                <strong>Haircut</strong>
                <span>bath, blow-dry, haircut</span></label
              >

              <input type="checkbox" name="services" value="nail-trim" />
              <label for="nail-trim">Nail Trim </label>

              <input type="checkbox" id="" name="services" value="" />
              <label for=""></label>

              <input type="checkbox" id="" name="services" value="" />
              <label for=""></label>
            </fieldset>

            <input type="submit" value="Submit" />
          </form>
        </div>
      </section>
    </main>

    <!--footer-->
    <footer>
      <div class="container">
        <div>
          <h3>Opening Hours</h3>
          <p>Monday - Saturday: 9am - 5pm</p>
          <p>Sunday: Closed</p>
        </div>
        <div>
          <h3>Contac Us</h3>
          <p>Phone: 07 111 1234</p>
          <p>Hamilton CBD</p>
        </div>
        <p class="copyright">&copy; Copyright 2026 by Snazzy Paws Grooming.</p>
      </div>
    </footer>
  </body>
</html>
