<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us</title>
  <meta name="description"
    content="Contact Snazzy Paws Grooming for enquiries, and information about our grooming services.">
  <!--bootstrap CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <!--header-->
  <header>
    <nav class="navbar navbar-expand-lg mt-4" aria-label="top navigation">
      <div class="container">
        <!--company name-->
        <a href="index.html" class="navbar-brand fw-bold fs-2">Snazzy Paws Grooming</a>
        <!--hamburger menu button-->
        <button class="navbar-toggler p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
          aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!--navigation menu-->
        <div class="collapse navbar-collapse text-center mt-3" id="navbarText">
          <ul class="navbar-nav ms-auto nav-pills gap-1 gap-lg-3">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item"><a href="services.html" class="nav-link">Services</a></li>
            <li class="nav-item"><a href="gallery.html" class="nav-link">Gallery</a></li>
            <li class="nav-item"><a href="booking.html" class="nav-link">Book</a>
            </li>
            <li class="nav-item"><a href="contact.html" class="nav-link active text-white"
                aria-current="page">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!--main content-->
  <main>
    <section class="top-section">
      <div class="container">
        <h1>Get in touch</h1>
        <p class="section-description">We would love to hear from you.</p>
        <div class="row">
          <!--contact form-->
          <div class="col">
            <form class="booking-form" action="#">
              <h2>Contact Us</h2>
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required>

              <label for="email">Email Address:</label>
              <input type="email" id="email" name="email" required>

              <label for="phone">Phone number:</label>
              <input type="tel" id="phone" name="phone">

              <label for="comment">Your message: </label>
              <textarea id="comment" name="comment" rows="5"></textarea>

              <!--submit button-->
              <div class="submit">
                <input type="submit" class="submit-button" value="SUBMIT" aria-label="Submit the contact form">
              </div>
            </form>
          </div>
          <!--google map-->
          <div class="col">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d100912.72106074821!2d175.1659904442167!3d-37.77779231085154!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d6d227487a63621%3A0x500ef6143a29903!2sHamilton!5e0!3m2!1sen!2snz!4v1784681270382!5m2!1sen!2snz"
              width="600" height="450" style="border: 0" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"
              aria-label="Map showing the location of Snazzy Paws Grooming in Hamilton, New Zealand"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!--footer-->
  <footer class="bg-secondary text-white">
    <div class="container py-4">
      <div class="row">
        <div class="col-md-4">
          <h2>Opening Hours</h2>
          <p>Monday - Saturday: 9am - 5pm</p>
          <p>Sunday: Closed</p>
        </div>
        <div class="col-md-4">
          <h2>Contact Us</h2>
          <p>Phone: 07 111 1234</p>
          <p>Hamilton CBD</p>
        </div>
        <div class="col-md-4">
          <p>&copy; 2026 Snazzy Paws Grooming</p>
        </div>
      </div>
    </div>
  </footer>
  <!--bootstrap JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
